<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoPixel Wall — 公共像素墙</title>
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="/assets/wall.css">
</head>
<body>
  <header class="sticky top-0 z-10 flex items-center justify-between border-b border-line bg-panel px-5 py-3">
    <div class="inline-flex items-center gap-2 font-bold tracking-wide"><span class="ic" data-icon="squares-four"></span> GeoPixel Wall</div>
    <nav class="flex items-center gap-4">
      <a href="/dashboard.html" id="nav-dashboard" class="inline-flex items-center gap-1.5"><span class="ic" data-icon="user-circle" data-icon-size="16"></span> 我的后台</a>
      <a href="/admin.html" id="nav-admin" hidden class="inline-flex items-center gap-1.5"><span class="ic" data-icon="shield-check" data-icon-size="16"></span> 管理后台</a>
    </nav>
  </header>

  <main class="flex flex-wrap items-start gap-5 p-5">
    <section class="min-w-[320px] flex-[1_1_640px]">
      <div id="wall" class="wall" tabindex="0" aria-label="像素墙，拖选矩形区域发布内容">
        <div id="grid-overlay" class="grid-overlay"></div>
        <div id="cells" class="cells"></div>
        <div id="selection" class="selection" hidden></div>
      </div>
      <p class="mt-2 inline-flex items-center gap-1.5 text-[13px] text-muted"><span class="ic" data-icon="crosshair" data-icon-size="15"></span> 拖选矩形区域发布内容 · 触屏同样支持 · 点击已占用区域查看详情</p>
    </section>

    <aside class="w-full flex-[1_1_320px] max-w-[420px] max-[720px]:max-w-none rounded-[10px] border border-line bg-panel p-[18px]" id="side-panel">
      <div id="panel-view">
        <h3 class="mb-3 flex items-center gap-2 text-[17px] font-semibold"><span class="ic text-accent" data-icon="squares-four"></span> 像素墙</h3>
        <p class="mb-3">选择一块空闲区域，展示你的文字、图片与链接。</p>
        <ul class="space-y-1.5 text-[13px] text-muted">
          <li class="flex items-center gap-2"><span class="ic shrink-0 text-accent" data-icon="coins" data-icon-size="16"></span> 发布费用 = 面积 × 每格价格（一次性）</li>
          <li class="flex items-center gap-2"><span class="ic shrink-0 text-accent" data-icon="clock-counter-clockwise" data-icon-size="16"></span> 每日占用费 = 面积 × 每格日价</li>
          <li class="flex items-center gap-2"><span class="ic shrink-0 text-accent" data-icon="warning-circle" data-icon-size="16"></span> 余额不足时内容过期，位置释放给他人</li>
        </ul>
        <div id="occupied-info" class="mt-3 text-[13px] text-muted"></div>
      </div>

      <div id="panel-select" hidden>
        <h3 class="mb-3 flex items-center gap-2 text-[17px] font-semibold"><span class="ic text-accent" data-icon="plus"></span> 发布内容</h3>
        <div class="grid grid-cols-4 gap-2">
          <label class="flex flex-col gap-1 text-[13px] text-muted">X <input type="number" id="in-x" min="0" max="99"></label>
          <label class="flex flex-col gap-1 text-[13px] text-muted">Y <input type="number" id="in-y" min="0" max="99"></label>
          <label class="flex flex-col gap-1 text-[13px] text-muted">宽 <input type="number" id="in-w" min="1" max="100"></label>
          <label class="flex flex-col gap-1 text-[13px] text-muted">高 <input type="number" id="in-h" min="1" max="100"></label>
        </div>
        <p class="mt-2.5 font-semibold text-warn" id="fee-preview"></p>
        <label class="mt-2.5 block text-[13px] text-muted">文字（可选）<textarea id="in-text" maxlength="500" rows="3" class="mt-1"></textarea></label>
        <div id="text-fit-block" class="mt-1.5" hidden>
          <p class="text-fit" id="text-fit-info"></p>
          <button id="btn-use-rec" type="button" class="btn-link mt-0.5 mb-1" hidden>使用推荐尺寸</button>
          <div class="mt-2 text-xs text-muted">文字预览（等比缩放，与墙面布局一致）</div>
          <div id="text-preview" class="text-preview"></div>
        </div>
        <label class="mt-2.5 block text-[13px] text-muted">链接（可选，http/https）<input type="url" id="in-link" maxlength="300" placeholder="https://example.com" class="mt-1"></label>
        <label class="mt-2.5 block text-[13px] text-muted">图片（可选，JPEG/PNG/WebP/GIF）<input type="file" id="in-image" accept="image/jpeg,image/png,image/webp,image/gif" class="mt-1"></label>
        <img id="img-preview" class="mt-2 max-w-full rounded-md" alt="" hidden>
        <div class="mt-3.5 flex gap-2.5">
          <button id="btn-publish" class="btn btn-primary"><span class="ic" data-icon="check-circle" data-icon-size="16"></span> 发布</button>
          <button id="btn-cancel" class="btn"><span class="ic" data-icon="x" data-icon-size="16"></span> 取消</button>
        </div>
        <p class="msg" id="publish-msg"></p>
      </div>
    </aside>
  </main>

  <!-- 悬停浮层：显示内容块的完整信息 -->
  <div id="cell-tooltip" class="cell-tooltip" hidden></div>

  <script src="/assets/icons.js"></script>
  <script src="/assets/api.js"></script>
  <script src="/assets/wall.js"></script>
</body>
</html>
