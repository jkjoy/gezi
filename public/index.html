<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoPixel Wall — 公共像素墙</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="ic" data-icon="squares-four"></span> GeoPixel Wall</div>
    <nav>
      <a href="/dashboard.html" id="nav-dashboard"><span class="ic" data-icon="user-circle" data-icon-size="16"></span> 我的后台</a>
      <a href="/admin.html" id="nav-admin" hidden><span class="ic" data-icon="shield-check" data-icon-size="16"></span> 管理后台</a>
    </nav>
  </header>

  <main class="wall-page">
    <section class="wall-wrap">
      <div id="wall" class="wall" tabindex="0" aria-label="像素墙，拖选矩形区域发布内容">
        <div id="grid-overlay" class="grid-overlay"></div>
        <div id="cells" class="cells"></div>
        <div id="selection" class="selection" hidden></div>
      </div>
      <p class="hint"><span class="ic" data-icon="crosshair" data-icon-size="15"></span> 拖选矩形区域发布内容 · 触屏同样支持 · 点击已占用区域查看详情</p>
    </section>

    <aside class="panel" id="side-panel">
      <div id="panel-view">
        <h3><span class="ic" data-icon="squares-four"></span> 像素墙</h3>
        <p>选择一块空闲区域，展示你的文字、图片与链接。</p>
        <ul class="rules">
          <li><span class="ic" data-icon="coins" data-icon-size="16"></span> 发布费用 = 面积 × 每格价格（一次性）</li>
          <li><span class="ic" data-icon="clock-counter-clockwise" data-icon-size="16"></span> 每日占用费 = 面积 × 每格日价</li>
          <li><span class="ic" data-icon="warning-circle" data-icon-size="16"></span> 余额不足时内容过期，位置释放给他人</li>
        </ul>
        <div id="occupied-info" class="occupied-info"></div>
      </div>

      <div id="panel-select" hidden>
        <h3><span class="ic" data-icon="plus"></span> 发布内容</h3>
        <div class="coords">
          <label>X <input type="number" id="in-x" min="0" max="99"></label>
          <label>Y <input type="number" id="in-y" min="0" max="99"></label>
          <label>宽 <input type="number" id="in-w" min="1" max="100"></label>
          <label>高 <input type="number" id="in-h" min="1" max="100"></label>
        </div>
        <p class="fee-preview" id="fee-preview"></p>
        <label class="field">文字（可选）<textarea id="in-text" maxlength="500" rows="3"></textarea></label>
        <label class="field">链接（可选，http/https）<input type="url" id="in-link" maxlength="300" placeholder="https://example.com"></label>
        <label class="field">图片（可选，JPEG/PNG/WebP）<input type="file" id="in-image" accept="image/jpeg,image/png,image/webp"></label>
        <img id="img-preview" class="img-preview" alt="" hidden>
        <div class="actions">
          <button id="btn-publish" class="primary"><span class="ic" data-icon="check-circle" data-icon-size="16"></span> 发布</button>
          <button id="btn-cancel"><span class="ic" data-icon="x" data-icon-size="16"></span> 取消</button>
        </div>
        <p class="msg" id="publish-msg"></p>
      </div>
    </aside>
  </main>

  <!-- 悬停浮层：显示内容块的完整信息 -->
  <div id="cell-tooltip" class="cell-tooltip" hidden></div>

  <script src="/assets/icons.js"></script>
  <script src="/assets/api.js"></script>
  <script src="/assets/wall.js"></script>
</body>
</html>
